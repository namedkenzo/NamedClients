name: namedP Android
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: namedp-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - run: go test -race -v ./internal/androidrelay ./internal/client
      - run: go vet ./internal/androidrelay
      - run: node scripts/test_android_version.cjs
      - uses: actions/checkout@v7
        with:
          repository: namedkenzo/NamedICMP
          ref: a88c0e5de0a00611eb09fdf7d07a94c02b449154
          path: .compat-android-relay
      - run: node scripts/check_android_relay.cjs
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Resolve the Android SDK signing-store location
        run: |
          gradle -q -p android signingReport > signing-report.txt
          store=$(sed -n 's/^Store: //p' signing-report.txt | head -1)
          test -n "$store"
          echo "NAMEDP_SIGNING_STORE=$store" >> "$GITHUB_ENV"
          echo "Resolved Gradle signing store: $store"
      - uses: actions/cache@v4
        id: signing-cache
        with:
          path: ${{ env.NAMEDP_SIGNING_STORE }}
          key: namedp-android-development-keystore-v2
      - name: Install Android toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.0.13004108'
      - name: Build independent Android engines
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.0.13004108
        run: bash scripts/build_android_native.sh
      - run: gradle -p android testDebugUnitTest assembleDebug assembleRelease assembleDebugAndroidTest
      - name: Verify release signing continuity and non-debuggable manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download android-v0.2.2-alpha --pattern namedP-android-0.2.2-alpha-debug.apk --dir previous-apk
          apk=android/app/build/outputs/apk/release/app-release.apk
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          previous=$("$signer" verify --print-certs previous-apk/*.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          current=$("$signer" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test -n "$previous" && test -n "$current"
          if [ "$previous" != "$current" ]; then
            echo '::warning::The legacy APK signing key was not preserved. Candidate UI tests may run, but publication is blocked on main.'
            test "$GITHUB_REF" != refs/heads/main
          else
            echo 'APK signature matches the previously distributed build.'
          fi
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > apk-manifest.txt
          if rg -q 'application-debuggable' apk-manifest.txt; then echo 'Release APK must not be debuggable'; exit 1; fi
          echo 'Release manifest is not debuggable; legacy signature continuity is enforced on main.'
      - name: Enable KVM for UI emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android UI smoke and previews
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            gradle -p android connectedDebugAndroidTest
            mkdir -p dist/android/previews
            adb pull /sdcard/Pictures/namedP-tests/preview-light-idle.png dist/android/previews/light-idle.png
            adb pull /sdcard/Pictures/namedP-tests/preview-dark-idle.png dist/android/previews/dark-idle.png
            adb pull /sdcard/Pictures/namedP-tests/preview-dark-connecting.png dist/android/previews/dark-connecting.png
            adb pull /sdcard/Pictures/namedP-tests/preview-dark-connected-preview.png dist/android/previews/dark-connected-preview.png
            adb pull /sdcard/Pictures/namedP-tests/preview-details.png dist/android/previews/details.png
            node scripts/check_png.cjs dist/android/previews
            adb shell am instrument -w -r -e upgrade prepare -e class dev.namedkenzo.namedp.InterfaceTest#releaseUpgradePreservesEncryptedProfiles dev.namedkenzo.namedp.test/androidx.test.runner.AndroidJUnitRunner > upgrade-prepare.txt
            cat upgrade-prepare.txt
            if ! rg -q 'OK \(1 test\)' upgrade-prepare.txt; then exit 1; fi
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            adb shell am instrument -w -r -e upgrade verify -e class dev.namedkenzo.namedp.InterfaceTest#releaseUpgradePreservesEncryptedProfiles dev.namedkenzo.namedp.test/androidx.test.runner.AndroidJUnitRunner > upgrade-verify.txt
            cat upgrade-verify.txt
            if ! rg -q 'OK \(1 test\)' upgrade-verify.txt; then exit 1; fi
      - name: Package release APK
        run: |
          VERSION=$(node -e 'process.stdout.write(require("fs").readFileSync("android/app/build.gradle.kts","utf8").match(/versionName = "([^"]+)"/)[1])')
          mkdir -p dist/android
          cp android/app/build/outputs/apk/release/app-release.apk "dist/android/namedP-$VERSION-android.apk"
          (cd dist/android && sha256sum "namedP-$VERSION-android.apk" > SHA256SUMS)
      - name: Record credential-free interface previews
        run: |
          echo "NAMEDP_LIGHT_PREVIEW=$(base64 -w0 dist/android/previews/light-idle.png)"
          echo "NAMEDP_DARK_PREVIEW=$(base64 -w0 dist/android/previews/dark-idle.png)"
          echo "NAMEDP_DETAILS_PREVIEW=$(base64 -w0 dist/android/previews/details.png)"
      - uses: actions/upload-artifact@v7
        with:
          name: namedP-android-release
          path: |
            dist/android/namedP-*-android.apk
            dist/android/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: namedP-android-ui-previews
          path: dist/android/previews/*.png
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: namedP-android-test-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/androidTests/

