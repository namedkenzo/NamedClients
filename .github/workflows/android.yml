name: namedP Android
on:
  workflow_call:
    secrets:
      NAMEDP_ANDROID_KEYSTORE_BASE64:
        required: false
      NAMEDP_ANDROID_STORE_PASSWORD:
        required: false
      NAMEDP_ANDROID_KEY_ALIAS:
        required: false
      NAMEDP_ANDROID_KEY_PASSWORD:
        required: false
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: namedp-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - run: go test -race -v ./internal/androidrelay ./internal/client
      - name: Check stability Go formatting
        run: |
          files=(internal/client/{health,health_test,transport,socket_android}.go cmd/namedp-engine/main.go cmd/namedp-android-engine/main_android.go)
          test -z "$(gofmt -l "${files[@]}")"
      - run: go vet ./internal/androidrelay
      - run: node scripts/test_android_version.cjs
      - uses: actions/checkout@v7
        with:
          repository: namedkenzo/NamedICMP
          ref: a88c0e5de0a00611eb09fdf7d07a94c02b449154
          path: .compat-android-relay
      - run: node scripts/check_android_relay.cjs
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare owner signing identity without public key caches
        env:
          GH_TOKEN: ${{ github.token }}
          NAMEDP_KEYSTORE_BASE64: ${{ secrets.NAMEDP_ANDROID_KEYSTORE_BASE64 }}
          NAMEDP_STORE_PASSWORD: ${{ secrets.NAMEDP_ANDROID_STORE_PASSWORD }}
          NAMEDP_KEY_ALIAS: ${{ secrets.NAMEDP_ANDROID_KEY_ALIAS }}
          NAMEDP_KEY_PASSWORD: ${{ secrets.NAMEDP_ANDROID_KEY_PASSWORD }}
        run: bash scripts/prepare_android_signing.sh
      - name: Install Android toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.0.13004108'
      - name: Build independent Android engines
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.0.13004108
        run: bash scripts/build_android_native.sh
      - run: gradle -p android testDebugUnitTest assembleDebug assembleRelease assembleDebugAndroidTest
      - name: Verify approved signing identity and non-debuggable manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          current=$("$signer" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test -n "$current"
          if gh release view namedp-v1.0.0 >/dev/null 2>&1; then
            gh release download namedp-v1.0.0 --pattern namedP-1.0.0-android.apk --dir previous-apk
            previous=$("$signer" verify --print-certs previous-apk/*.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
            test -n "$previous" && test "$previous" = "$current"
            echo 'APK signature matches the stable 1.0.0 identity.'
          else
            echo 'Owner-approved new 1.0.0 identity. Legacy alpha users must back up profiles and reinstall.'
          fi
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > apk-manifest.txt
          command -v grep >/dev/null
          if grep -Fq 'application-debuggable' apk-manifest.txt; then echo 'Release APK must not be debuggable'; exit 1; fi
          echo 'Release manifest is not debuggable; future upgrades must preserve the stable identity.'
      - name: Enable KVM for UI emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android UI smoke and previews
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            gradle -p android connectedDebugAndroidTest
            mkdir -p dist/android/previews
            adb pull /sdcard/Pictures/namedP-tests/preview-light-idle.png dist/android/previews/light-idle.png
            adb pull /sdcard/Pictures/namedP-tests/preview-dark-idle.png dist/android/previews/dark-idle.png
            adb pull /sdcard/Pictures/namedP-tests/preview-dark-connecting.png dist/android/previews/dark-connecting.png
            adb pull /sdcard/Pictures/namedP-tests/preview-dark-connected-preview.png dist/android/previews/dark-connected-preview.png
            adb pull /sdcard/Pictures/namedP-tests/preview-details.png dist/android/previews/details.png
            node scripts/check_png.cjs dist/android/previews
            if [ -f previous-apk/namedP-1.0.0-android.apk ]; then adb install -r previous-apk/namedP-1.0.0-android.apk; else adb install -r android/app/build/outputs/apk/debug/app-debug.apk; fi
            adb install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r -e upgrade prepare -e class dev.namedkenzo.namedp.InterfaceTest#releaseUpgradePreservesEncryptedProfiles dev.namedkenzo.namedp.test/androidx.test.runner.AndroidJUnitRunner > upgrade-prepare.txt
            cat upgrade-prepare.txt
            if ! grep -Fq 'OK (1 test)' upgrade-prepare.txt; then exit 1; fi
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            adb shell am instrument -w -r -e upgrade verify -e class dev.namedkenzo.namedp.InterfaceTest#releaseUpgradePreservesEncryptedProfiles dev.namedkenzo.namedp.test/androidx.test.runner.AndroidJUnitRunner > upgrade-verify.txt
            cat upgrade-verify.txt
            if ! grep -Fq 'OK (1 test)' upgrade-verify.txt; then exit 1; fi
      - name: Package release APK
        run: |
          VERSION=$(node -e 'process.stdout.write(require("fs").readFileSync("android/app/build.gradle.kts","utf8").match(/versionName = "([^"]+)"/)[1])')
          mkdir -p dist/android
          cp android/app/build/outputs/apk/release/app-release.apk "dist/android/namedP-$VERSION-android.apk"
          (cd dist/android && sha256sum "namedP-$VERSION-android.apk" > SHA256SUMS)
      - name: Record credential-free interface previews
        run: |
          echo "NAMEDP_LIGHT_PREVIEW=$(base64 -w0 dist/android/previews/light-idle.png)"
          echo "NAMEDP_DARK_PREVIEW=$(base64 -w0 dist/android/previews/dark-idle.png)"
          echo "NAMEDP_DETAILS_PREVIEW=$(base64 -w0 dist/android/previews/details.png)"
      - uses: actions/upload-artifact@v7
        with:
          name: namedP-android-release
          path: |
            dist/android/namedP-*-android.apk
            dist/android/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: namedP-android-ui-previews
          path: dist/android/previews/*.png
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: namedP-android-test-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/androidTests/

