name: namedP Android
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'cmd/namedp-android-engine/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/build_android_native.sh'
      - '.github/workflows/android.yml'
  pull_request:
    paths: ['android/**', 'cmd/namedp-android-engine/**', 'internal/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: namedp-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: namedp-android-development-keystore-v2
      - name: Install Android toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.0.13004108'
      - name: Build independent Android engines
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.0.13004108
        run: bash scripts/build_android_native.sh
      - run: gradle -p android testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Enable KVM for UI emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android UI smoke and previews
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            gradle -p android connectedDebugAndroidTest
            mkdir -p dist/android/previews
            adb pull /sdcard/Pictures/namedP-tests/preview-light-idle.png dist/android/previews/light-idle.png
            adb pull /sdcard/Pictures/namedP-tests/preview-dark-idle.png dist/android/previews/dark-idle.png
            adb pull /sdcard/Pictures/namedP-tests/preview-dark-connecting.png dist/android/previews/dark-connecting.png
            adb pull /sdcard/Pictures/namedP-tests/preview-dark-connected-preview.png dist/android/previews/dark-connected-preview.png
            node scripts/check_png.cjs dist/android/previews
      - name: Package development APK
        run: |
          VERSION=$(node -e 'process.stdout.write(require("fs").readFileSync("android/app/build.gradle.kts","utf8").match(/versionName = "([^"]+)"/)[1])')
          mkdir -p dist/android
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/android/namedP-android-$VERSION-debug.apk"
          cp android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk dist/android/namedP-android-ui-tests.apk
          (cd dist/android && sha256sum "namedP-android-$VERSION-debug.apk" > SHA256SUMS)
      - name: Record credential-free interface previews
        run: |
          echo "NAMEDP_LIGHT_PREVIEW=$(base64 -w0 dist/android/previews/light-idle.png)"
          echo "NAMEDP_DARK_PREVIEW=$(base64 -w0 dist/android/previews/dark-idle.png)"
      - uses: actions/upload-artifact@v7
        with:
          name: namedP-android-development
          path: |
            dist/android/namedP-android-*-debug.apk
            dist/android/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: namedP-android-ui-previews
          path: dist/android/previews/*.png
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: namedP-android-test-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/androidTests/
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release-android]')
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: namedP-android-development
          path: android-release
      - uses: actions/download-artifact@v8
        with:
          name: namedP-android-ui-previews
          path: android-previews
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -e 'process.stdout.write(require("fs").readFileSync("android/app/build.gradle.kts","utf8").match(/versionName = "([^"]+)"/)[1])')
          TAG="android-v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Preserve the original tagged APK/checksum; repair only its previews.
            gh release upload "$TAG" android-previews/*.png --clobber
          else
            gh release create "$TAG" android-release/*.apk android-release/SHA256SUMS android-previews/*.png --target "$GITHUB_SHA" --prerelease --title "namedP Android $VERSION · Development APK" --notes-file "docs/RELEASE-$TAG.md"
          fi
